<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI Layout Analysis</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            background-color: #ffffff;
            color: #000000;
            padding: 20px;
        }

        /* Top Bar */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
        }

        .search-container {
            display: flex;
            align-items: center;
            border: 2px solid #000;
            border-radius: 30px;
            padding: 8px 15px;
            width: 75%;
            max-width: 400px;
        }

        .search-container i {
            margin-right: 10px;
            font-size: 18px;
        }

        .search-container input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 16px;
            background: transparent;
        }

        .refresh-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Main Content Area */
        .main-content {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px dashed #ddd; /* Placeholder border to show content region */
            border-radius: 8px;
            margin-bottom: 20px;
            padding: 20px;
            text-align: center;
            color: #888;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            padding: 10px 0;
            border-top: 1px solid #eee;
        }

        .nav-item {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 28px;
            color: #000;
            transition: color 0.2s;
        }

        .nav-item:hover {
            color: #555;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <header class="top-bar">
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="searchInput" placeholder="Search...">
        </div>
        <button class="refresh-btn" id="refreshBtn" title="Refresh">
            <i class="fa-solid fa-rotate-right"></i>
        </button>
    </header>

    <!-- Main Content Area -->
    <main class="main-content" id="mainContent">
        <p>Main Content Area (Dynamic results will appear here)</p>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <button class="nav-item" id="deleteBtn" title="Delete">
            <i class="fa-solid fa-trash-can"></i>
        </button>
        <button class="nav-item" id="homeBtn" title="Home">
            <i class="fa-solid fa-house"></i>
        </button>
        <button class="nav-item" id="menuBtn" title="Menu">
            <i class="fa-solid fa-bars"></i>
        </button>
    </nav>

    <!-- JavaScript functionality -->
    <script>
        // Select elements
        const searchInput = document.getElementById('searchInput');
        const refreshBtn = document.getElementById('refreshBtn');
        const deleteBtn = document.getElementById('deleteBtn');
        const homeBtn = document.getElementById('homeBtn');
        const menuBtn = document.getElementById('menuBtn');
        const mainContent = document.getElementById('mainContent');

        // Event listener for Search Bar input
        searchInput.addEventListener('input', (e) => {
            const query = e.target.value;
            console.log("Searching for:", query);
            // Add your dynamic search logic here
        });

        // Event listener for Refresh Button
        refreshBtn.addEventListener('click', () => {
            mainContent.innerHTML = `<p style="color: green;">Content refreshed successfully!</p>`;
            setTimeout(() => {
                mainContent.innerHTML = `<p>Main Content Area (Dynamic results will appear here)</p>`;
            }, 1500);
        });

        // Event listener for Delete Button
        deleteBtn.addEventListener('click', () => {
            alert("Delete action triggered!");
        });

        // Event listener for Home Button
        homeBtn.addEventListener('click', () => {
            alert("Home navigation triggered!");
        });

        // Event listener for Menu Button
        menuBtn.addEventListener('click', () => {
            alert("Menu options opened!");
        });
    </script>

</body>
</html>
